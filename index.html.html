<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>School Hub · PWA</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- CONFIGURATION -->
  <script src="config.js"></script>
  
  <!-- Favicon using nouscomplex.png -->
  <link rel="icon" type="image/png" sizes="32x32" href="nouscomplex.png">
  <link rel="apple-touch-icon" href="nouscomplex.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href='data:application/json;base64,ewogICJuYW1lIjogIlNjaG9vbCBIdWIiLAogICJzaG9ydF9uYW1lIjogIkh1YiIsCiAgImRlc2NyaXB0aW9uIjogIlVuaWZpZWQgY29tbXVuaWNhdGlvbiBwbGF0Zm9ybSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGUxYzc2IiwKICAidGhlbWVfY29sb3IiOiAiIzY3YjNmOSIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogIm5vdXNjb21wbGV4LnBuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==' />
</head>
<body>

<div id="app" class="max-w-7xl mx-auto px-3 py-4 md:py-6 min-h-screen flex flex-col">
  
  <!-- ===== AUTH CARD ===== -->
  <div id="authCard" class="glass max-w-md mx-auto mt-12 p-6 rounded-3xl shadow-2xl w-full">
    <div class="flex items-center justify-center gap-3 mb-2">
      <img src="nouscomplex.png" alt="NousComplex Logo" class="logo-auth" id="authLogo">
      <h1 class="text-3xl font-bold text-[#0e1c76] flex items-center gap-2">
        School Hub
      </h1>
    </div>
    <p class="text-sm text-gray-600 mb-4 text-center">Sign in with your School ID</p>
    <div class="space-y-3">
      <input id="usernameInput" type="text" placeholder="e.g. student042 or teacher005" class="w-full p-3 rounded-xl border border-white/30 bg-white/40 backdrop-blur-sm text-[#0e1c76] placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#67b3f9]">
      <button id="loginBtn" class="w-full btn-primary py-3 rounded-xl font-semibold shadow-md flex items-center justify-center gap-2">
        <i class="fas fa-key"></i> Enter Hub
      </button>
      <p id="authError" class="text-red-500 text-sm hidden"></p>
    </div>
    <p class="text-xs text-gray-400 mt-4 text-center">Simulated login · email confirmation OFF</p>
  </div>

  <!-- ===== MAIN DASHBOARD ===== -->
  <div id="dashboard" class="hidden flex-1 flex flex-col lg:flex-row gap-4 min-h-[80vh]">
    
    <!-- SIDEBAR -->
    <aside class="lg:w-72 w-full glass rounded-3xl p-4 flex flex-col max-h-[90vh] overflow-y-auto">
      <div class="flex items-center gap-2 mb-3">
        <img src="nouscomplex.png" alt="NousComplex Logo" class="logo-sidebar" id="sidebarLogo">
        <span class="font-bold text-[#0e1c76]">
          <i class="fas fa-comment-dots text-[#67b3f9] mr-1"></i>Channels
        </span>
        <span id="userBadge" class="text-xs bg-[#67b3f9]/20 px-3 py-1 rounded-full text-[#0e1c76] ml-auto"></span>
      </div>
      <div id="channelList" class="space-y-1 flex-1">
        <!-- dynamic channels -->
      </div>
      <!-- Admin panel -->
      <div id="adminPanel" class="hidden mt-4 pt-4 border-t border-white/30">
        <h4 class="text-sm font-semibold text-[#0e1c76]">
          <i class="fas fa-user-cog mr-1"></i> Admin Console
        </h4>
        <div class="space-y-2 mt-2">
          <button id="createChannelBtn" class="w-full text-sm glass py-1.5 rounded-lg flex items-center justify-center gap-1 hover:bg-white/40">
            <i class="fas fa-plus-circle text-[#67b3f9]"></i> New Channel
          </button>
          <button id="rosterGenBtn" class="w-full text-sm glass py-1.5 rounded-lg flex items-center justify-center gap-1 hover:bg-white/40">
            <i class="fas fa-users-cog"></i> 1-Click Roster
          </button>
          <button id="exportAttendanceBtn" class="w-full text-sm glass py-1.5 rounded-lg flex items-center justify-center gap-1 hover:bg-white/40">
            <i class="fas fa-file-export"></i> Export CSV
          </button>
          <div class="flex gap-1">
            <input id="assignStudentInput" placeholder="studentID" class="w-2/3 text-sm p-1 rounded bg-white/40 border border-white/30">
            <button id="assignStudentBtn" class="w-1/3 text-sm glass py-1 rounded hover:bg-white/40">Assign</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col gap-4 min-w-0">
      <!-- Status tray -->
      <div class="glass rounded-3xl p-3">
        <div class="flex items-center gap-3 overflow-x-auto scrollbar-hide" id="statusTray">
          <div id="statusPlaceholder" class="text-sm text-gray-500">No updates</div>
        </div>
        <div id="statusAddBtn" class="hidden mt-2">
          <button id="postStatusBtn" class="glass text-sm px-4 py-1.5 rounded-full flex items-center gap-1 hover:bg-white/40">
            <i class="fas fa-plus-circle text-[#67b3f9]"></i> Post update
          </button>
        </div>
      </div>

      <!-- Chat messages -->
      <div class="glass rounded-3xl p-4 flex-1 overflow-y-auto max-h-[40vh] lg:max-h-[50vh]" id="chatContainer">
        <div id="chatMessages" class="space-y-2">
          <div class="text-center text-xs text-gray-400">Select a channel to start</div>
        </div>
        <div id="fileUploadStatus" class="text-xs text-[#0e1c76] hidden"></div>
      </div>

      <!-- Input bar -->
      <div class="glass rounded-3xl p-3 flex flex-wrap items-center gap-2">
        <input id="messageInput" type="text" placeholder="Type a message..." class="flex-1 min-w-[120px] p-2 rounded-xl bg-white/40 border border-white/30 focus:outline-none focus:ring-1 focus:ring-[#67b3f9]">
        <label for="fileInput" class="cursor-pointer text-[#0e1c76] px-2 hover:text-[#67b3f9]">
          <i class="fas fa-paperclip"></i>
        </label>
        <input id="fileInput" type="file" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
        <button id="sendMsgBtn" class="btn-primary p-2 px-4 rounded-xl text-sm">
          <i class="fas fa-paper-plane"></i>
        </button>
        <button id="joinLiveBtn" class="btn-sky p-2 px-4 rounded-xl text-sm flex items-center gap-1">
          <i class="fas fa-video"></i> <span id="liveBtnText">Join Live Class</span>
        </button>
      </div>

      <!-- Video iframe -->
      <div id="videoContainer" class="glass rounded-3xl overflow-hidden hidden relative" style="min-height: 280px;">
        <iframe id="videoIframe" src="" allow="camera; microphone; display-capture; autoplay; encrypted-media" allowfullscreen></iframe>
        <button id="closeVideoBtn" class="absolute top-2 right-2 bg-black/40 text-white rounded-full p-1.5 text-sm backdrop-blur-sm hover:bg-black/60">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </main>
  </div>

  <!-- ===== STATUS MODAL ===== -->
  <div id="statusModal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
    <div class="glass max-w-sm w-full rounded-3xl p-6 shadow-2xl">
      <h3 id="statusModalTitle" class="font-bold text-[#0e1c76]">Update</h3>
      <p id="statusModalContent" class="my-2 text-gray-700"></p>
      <div class="w-full bg-gray-200 rounded-full h-2.5 my-3">
        <div id="statusProgress" class="bg-[#67b3f9] h-2.5 rounded-full" style="width: 0%"></div>
      </div>
      <button id="closeStatusModal" class="mt-2 w-full glass py-2 rounded-xl text-sm hover:bg-white/40">Close</button>
    </div>
  </div>
</div>

<!-- JavaScript -->
<script src="app.js"></script>

</body>
</html>
