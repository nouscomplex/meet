<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Ping - Messaging</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    /* ============================================================
       ROOT VARIABLES
       ============================================================ */
    :root {
      --primary: #0e1b75;
      --primary-dark: #0a1555;
      --primary-light: #1a2d95;
      --secondary: #6bb4fa;
      --secondary-light: #8ec8fc;
      --secondary-dark: #4a9ae0;
      --bg: #f0f2f8;
      --surface: #ffffff;
      --border: #DBD9D9;
      --text-primary: #1a1a2e;
      --text-secondary: #6b6b80;
      --text-light: #9999aa;
      --shadow: 0 2px 16px rgba(14, 27, 117, 0.08);
      --shadow-lg: 0 8px 40px rgba(14, 27, 117, 0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lato', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       APP LAYOUT
       ============================================================ */
    .app-container {
      display: flex;
      min-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      background: var(--bg);
    }

    /* ============================================================
       SIDEBAR (Desktop)
       ============================================================ */
    .sidebar {
      width: 72px;
      background: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      transition: var(--transition);
      z-index: 100;
    }

    .sidebar-logo {
      width: 44px;
      height: 44px;
      background: var(--secondary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      margin-bottom: 32px;
      cursor: pointer;
      transition: var(--transition);
    }
    .sidebar-logo:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(107, 180, 250, 0.3);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .sidebar-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .sidebar-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .sidebar-btn.active {
      background: rgba(107, 180, 250, 0.2);
      color: var(--secondary);
    }
    .sidebar-btn .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: var(--secondary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--secondary);
      color: var(--primary);
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition);
    }
    .sidebar-avatar:hover {
      border-color: var(--secondary);
      transform: scale(1.05);
    }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .main-content {
      flex: 1;
      display: flex;
      min-width: 0;
      background: var(--bg);
    }

    /* ============================================================
       CHAT LIST (Left Panel)
       ============================================================ */
    .chat-list-panel {
      width: 380px;
      min-width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow: hidden;
    }

    .chat-list-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
    }

    .chat-list-header h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .chat-list-header h1 span {
      color: var(--secondary);
    }

    .search-bar {
      position: relative;
      margin-top: 12px;
    }
    .search-bar i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 14px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text-primary);
      transition: var(--transition);
      outline: none;
    }
    .search-bar input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(107, 180, 250, 0.1);
    }
    .search-bar input::placeholder {
      color: var(--text-light);
    }

    .chat-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px 20px;
    }

    /* Chat items */
    .chat-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }
    .chat-item:hover {
      background: var(--bg);
    }
    .chat-item.active {
      background: rgba(107, 180, 250, 0.08);
    }
    .chat-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      background: var(--secondary);
      border-radius: 0 4px 4px 0;
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }
    .chat-avatar.blue { background: #4a9ae0; }
    .chat-avatar.purple { background: #7c6bc4; }
    .chat-avatar.green { background: #4caf84; }
    .chat-avatar.orange { background: #e8945a; }
    .chat-avatar.pink { background: #d97a9a; }
    .chat-avatar.teal { background: #4db6ac; }
    .chat-avatar.red { background: #e57373; }
    .chat-avatar.grey { background: #90a4ae; }

    .chat-info {
      flex: 1;
      min-width: 0;
    }
    .chat-name {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-name .group-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-light);
      background: var(--bg);
      padding: 1px 8px;
      border-radius: 12px;
    }
    .chat-preview {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .chat-preview .sender {
      font-weight: 700;
      color: var(--text-primary);
    }

    .chat-meta {
      flex-shrink: 0;
      text-align: right;
      margin-left: 8px;
    }
    .chat-time {
      font-size: 11px;
      color: var(--text-light);
    }
    .chat-unread {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      background: var(--secondary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 12px;
      padding: 0 6px;
      margin-top: 4px;
    }

    /* ============================================================
       CHAT VIEW (Right Panel)
       ============================================================ */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      min-width: 0;
    }

    .chat-view-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .chat-view-back {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
    }
    .chat-view-back:hover {
      color: var(--primary);
    }

    .chat-view-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }

    .chat-view-info {
      flex: 1;
      min-width: 0;
    }
    .chat-view-name {
      font-weight: 700;
      font-size: 16px;
      color: var(--text-primary);
    }
    .chat-view-status {
      font-size: 12px;
      color: var(--text-light);
    }
    .chat-view-status .online-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4caf84;
      border-radius: 50%;
      margin-right: 4px;
    }

    .chat-view-actions {
      display: flex;
      gap: 4px;
    }
    .chat-view-actions button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
    }
    .chat-view-actions button:hover {
      background: var(--bg);
      color: var(--primary);
    }

    /* Messages */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .message-date-divider {
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      padding: 8px 0;
      position: relative;
    }
    .message-date-divider::before {
      content: '';
      position: absolute;
      left: 20%;
      right: 20%;
      top: 50%;
      height: 1px;
      background: var(--border);
    }
    .message-date-divider span {
      background: var(--bg);
      padding: 0 12px;
      position: relative;
      z-index: 1;
    }

    .message {
      max-width: 70%;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .message.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    .message.received {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.sent .message-bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.received .message-bubble {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-light);
      margin-top: 2px;
    }
    .message.sent .message-meta {
      justify-content: flex-end;
    }
    .message-meta .read-receipt {
      color: var(--secondary);
    }

    /* Composer */
    .composer-container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .composer-container .attach-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .composer-container .attach-btn:hover {
      background: var(--bg);
      color: var(--primary);
    }

    .composer-container input[type="text"] {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      outline: none;
      background: var(--bg);
      color: var(--text-primary);
      transition: var(--transition);
    }
    .composer-container input[type="text"]:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(107, 180, 250, 0.08);
    }

    .composer-container .send-btn {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .composer-container .send-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-align: center;
      padding: 40px;
    }
    .empty-state i {
      font-size: 48px;
      color: var(--border);
      margin-bottom: 16px;
    }
    .empty-state h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 14px;
      max-width: 300px;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1024px) {
      .chat-list-panel {
        width: 340px;
        min-width: 280px;
      }
    }

    @media (max-width: 820px) {
      .sidebar {
        width: 60px;
        padding: 16px 0;
      }
      .sidebar-logo {
        width: 38px;
        height: 38px;
        font-size: 17px;
      }
      .sidebar-btn {
        width: 42px;
        height: 42px;
        font-size: 17px;
      }
      .sidebar-avatar {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }
      .chat-list-panel {
        width: 300px;
        min-width: 260px;
      }
    }

    @media (max-width: 720px) {
      .app-container {
        flex-direction: column;
      }

      .sidebar {
        display: none;
      }

      .mobile-sidebar {
        display: flex !important;
        background: var(--primary);
        padding: 12px 20px;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .mobile-sidebar .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        font-weight: 900;
        font-size: 20px;
      }
      .mobile-sidebar .logo span {
        color: var(--secondary);
      }
      .mobile-sidebar .logo-icon {
        width: 36px;
        height: 36px;
        background: var(--secondary);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: var(--primary);
        font-weight: 900;
      }
      .mobile-sidebar .mobile-actions {
        display: flex;
        gap: 8px;
      }
      .mobile-sidebar .mobile-actions button {
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: var(--transition);
      }
      .mobile-sidebar .mobile-actions button:hover {
        background: rgba(255,255,255,0.2);
      }

      .mobile-sidebar {
        display: flex !important;
      }

      .main-content {
        flex-direction: column;
        height: calc(100vh - 60px);
      }

      .chat-list-panel {
        width: 100%;
        min-width: unset;
        height: 100%;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .chat-list-panel.hidden {
        display: none;
      }

      .chat-view {
        height: 100%;
        display: none;
      }
      .chat-view.visible {
        display: flex;
      }

      .chat-view-back {
        display: block;
      }

      .chat-list-header h1 {
        font-size: 22px;
      }

      .chat-item {
        padding: 10px 14px;
      }
      .chat-avatar {
        width: 42px;
        height: 42px;
        font-size: 16px;
      }

      .messages-container {
        padding: 14px 16px;
      }
      .message {
        max-width: 85%;
      }

      .composer-container {
        padding: 10px 14px;
      }
    }

    @media (max-width: 480px) {
      .chat-list-header {
        padding: 14px 16px 12px;
      }
      .chat-list-header h1 {
        font-size: 20px;
      }
      .search-bar input {
        font-size: 13px;
        padding: 8px 12px 8px 36px;
      }
      .chat-item {
        padding: 8px 12px;
        gap: 10px;
      }
      .chat-avatar {
        width: 38px;
        height: 38px;
        font-size: 14px;
      }
      .chat-name {
        font-size: 14px;
      }
      .chat-preview {
        font-size: 12px;
      }
      .message-bubble {
        font-size: 13px;
        padding: 8px 14px;
      }
      .chat-view-header {
        padding: 12px 16px;
      }
      .messages-container {
        padding: 12px 14px;
      }
      .composer-container input[type="text"] {
        font-size: 13px;
        padding: 8px 12px;
      }
    }

    /* ============================================================
       SCROLLBAR STYLING
       ============================================================ */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-light);
    }

    /* ============================================================
       UTILITY
       ============================================================ */
    .hidden {
      display: none !important;
    }

    .mobile-sidebar {
      display: none !important;
    }

    .no-messages {
      text-align: center;
      color: var(--text-light);
      font-size: 14px;
      padding: 40px 20px;
    }
    .no-messages i {
      font-size: 32px;
      color: var(--border);
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-logo">P</div>
    <nav class="sidebar-nav">
      <button class="sidebar-btn active" title="Chats">
        <i class="fas fa-comment-dots"></i>
        <span class="badge">3</span>
      </button>
      <button class="sidebar-btn" title="Contacts">
        <i class="fas fa-address-book"></i>
      </button>
      <button class="sidebar-btn" title="Settings">
        <i class="fas fa-gear"></i>
      </button>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-avatar">JD</div>
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main-content">

    <!-- ===== MOBILE SIDEBAR ===== -->
    <div class="mobile-sidebar">
      <div class="logo">
        <div class="logo-icon">P</div>
        <span>Ping</span>
      </div>
      <div class="mobile-actions">
        <button onclick="toggleChatList()"><i class="fas fa-search"></i></button>
        <button onclick="toggleChatList()"><i class="fas fa-ellipsis-vertical"></i></button>
      </div>
    </div>

    <!-- ===== CHAT LIST ===== -->
    <div class="chat-list-panel" id="chatListPanel">
      <div class="chat-list-header">
        <h1>Ping</h1>
        <div class="search-bar">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search messages, groups..." id="searchInput">
        </div>
      </div>
      <div class="chat-list-scroll" id="chatList">
        <!-- Chat items rendered by JS -->
      </div>
    </div>

    <!-- ===== CHAT VIEW ===== -->
    <div class="chat-view" id="chatView">
      <div class="chat-view-header">
        <button class="chat-view-back" onclick="goBack()">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="chat-view-avatar blue" id="viewAvatar">SJ</div>
        <div class="chat-view-info">
          <div class="chat-view-name" id="viewName">Sarah Jenkins</div>
          <div class="chat-view-status" id="viewStatus">
            <span class="online-dot"></span> Online
          </div>
        </div>
        <div class="chat-view-actions">
          <button title="Call"><i class="fas fa-phone"></i></button>
          <button title="Video"><i class="fas fa-video"></i></button>
          <button title="More"><i class="fas fa-ellipsis-vertical"></i></button>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <!-- Messages rendered by JS -->
      </div>

      <div class="composer-container">
        <button class="attach-btn" title="Attach">
          <i class="fas fa-paperclip"></i>
        </button>
        <input type="text" placeholder="Type a message..." id="messageInput">
        <button class="send-btn" onclick="sendMessage()">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // DATA
  // ============================================================
  const chatData = [
    {
      id: 1,
      name: 'Sarah Jenkins',
      avatar: 'SJ',
      color: 'blue',
      preview: 'Are we still meeting up for coffee today?',
      time: '12:45 PM',
      unread: 2,
      online: true,
      messages: [
        { id: 1, sender: 'Sarah Jenkins', text: 'Hey! Did you have a chance to look at the draft?', time: '12:30 PM', sent: false },
        { id: 2, sender: 'Sarah Jenkins', text: 'I uploaded the new design directions to the share folder.', time: '12:35 PM', sent: false },
        { id: 3, sender: 'Me', text: 'Yes! I just went over it. The copy looks really crisp and structured perfectly.', time: '12:40 PM', sent: true },
        { id: 4, sender: 'Sarah Jenkins', text: 'Awesome! Let me look over them now.', time: '12:42 PM', sent: false },
        { id: 5, sender: 'Me', text: 'Looks great. I\'ll add the feedback document directly there.', time: '12:45 PM', sent: true }
      ]
    },
    {
      id: 2,
      name: 'Design Critique Group',
      avatar: 'DC',
      color: 'purple',
      preview: 'Alex: I uploaded the new wireframes for review.',
      time: '11:20 AM',
      unread: 5,
      online: false,
      isGroup: true,
      messages: [
        { id: 1, sender: 'Alex Rivera', text: 'I uploaded the new wireframes for review.', time: '11:00 AM', sent: false },
        { id: 2, sender: 'Me', text: 'Great! I\'ll take a look right away.', time: '11:10 AM', sent: true },
        { id: 3, sender: 'Emma Watson', text: 'The navigation flow looks much cleaner now.', time: '11:20 AM', sent: false }
      ]
    },
    {
      id: 3,
      name: 'Michael Chang',
      avatar: 'MC',
      color: 'green',
      preview: 'Send you the project update document.',
      time: '10:15 AM',
      unread: 0,
      online: false,
      messages: [
        { id: 1, sender: 'Michael Chang', text: 'I\'ll send you the project update document.', time: '10:00 AM', sent: false },
        { id: 2, sender: 'Me', text: 'Thanks Michael! Looking forward to it.', time: '10:15 AM', sent: true }
      ]
    },
    {
      id: 4,
      name: 'Emma Watson',
      avatar: 'EW',
      color: 'pink',
      preview: 'That looks absolutely amazing!',
      time: '9:30 AM',
      unread: 1,
      online: true,
      messages: [
        { id: 1, sender: 'Emma Watson', text: 'That looks absolutely amazing! The design is incredible.', time: '9:30 AM', sent: false }
      ]
    },
    {
      id: 5,
      name: 'Alex Rivera',
      avatar: 'AR',
      color: 'orange',
      preview: 'Yes! I just went over it. The copy looks...',
      time: 'Yesterday',
      unread: 0,
      online: false,
      messages: [
        { id: 1, sender: 'Alex Rivera', text: 'Yes! I just went over it. The copy looks really crisp and structured perfectly.', time: 'Yesterday', sent: false }
      ]
    },
    {
      id: 6,
      name: 'David Miller',
      avatar: 'DM',
      color: 'teal',
      preview: 'Hey! Did you get my last message?',
      time: 'Yesterday',
      unread: 0,
      online: false,
      messages: [
        { id: 1, sender: 'David Miller', text: 'Hey! Did you get my last message?', time: 'Yesterday', sent: false }
      ]
    }
  ];

  // ============================================================
  // STATE
  // ============================================================
  let activeChatId = 1;
  let currentView = 'list'; // 'list' or 'chat'

  // ============================================================
  // DOM REFS
  // ============================================================
  const chatListEl = document.getElementById('chatList');
  const messagesContainer = document.getElementById('messagesContainer');
  const viewName = document.getElementById('viewName');
  const viewAvatar = document.getElementById('viewAvatar');
  const viewStatus = document.getElementById('viewStatus');
  const searchInput = document.getElementById('searchInput');
  const messageInput = document.getElementById('messageInput');
  const chatListPanel = document.getElementById('chatListPanel');
  const chatView = document.getElementById('chatView');

  // ============================================================
  // RENDER FUNCTIONS
  // ============================================================
  function renderChatList(filter = '') {
    const query = filter.toLowerCase().trim();
    const filtered = chatData.filter(chat => 
      chat.name.toLowerCase().includes(query) ||
      chat.preview.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
      chatListEl.innerHTML = `
        <div style="text-align:center;padding:40px 20px;color:var(--text-light);">
          <i class="fas fa-search" style="font-size:24px;display:block;margin-bottom:12px;color:var(--border);"></i>
          No conversations found
        </div>
      `;
      return;
    }

    chatListEl.innerHTML = filtered.map(chat => `
      <div class="chat-item ${chat.id === activeChatId ? 'active' : ''}" onclick="openChat(${chat.id})">
        <div class="chat-avatar ${chat.color}">${chat.avatar}</div>
        <div class="chat-info">
          <div class="chat-name">
            ${chat.name}
            ${chat.isGroup ? '<span class="group-badge">Group</span>' : ''}
          </div>
          <div class="chat-preview">
            ${chat.preview}
          </div>
        </div>
        <div class="chat-meta">
          <div class="chat-time">${chat.time}</div>
          ${chat.unread > 0 ? `<div class="chat-unread">${chat.unread}</div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function renderMessages(chatId) {
    const chat = chatData.find(c => c.id === chatId);
    if (!chat) return;

    viewName.textContent = chat.name;
    viewAvatar.textContent = chat.avatar;
    viewAvatar.className = `chat-view-avatar ${chat.color}`;
    viewStatus.innerHTML = chat.online 
      ? '<span class="online-dot"></span> Online' 
      : 'Last seen recently';

    if (chat.messages.length === 0) {
      messagesContainer.innerHTML = `
        <div class="no-messages">
          <i class="fas fa-comment"></i>
          No messages yet
        </div>
      `;
      return;
    }

    // Group messages by date
    let html = '';
    let lastDate = '';

    chat.messages.forEach((msg, index) => {
      const date = msg.time;
      if (date !== lastDate) {
        html += `<div class="message-date-divider"><span>${date}</span></div>`;
        lastDate = date;
      }

      const isSent = msg.sent;
      html += `
        <div class="message ${isSent ? 'sent' : 'received'}">
          <div class="message-bubble">${msg.text}</div>
          <div class="message-meta">
            ${msg.time}
            ${isSent ? '<span class="read-receipt"><i class="fas fa-check-double"></i></span>' : ''}
          </div>
        </div>
      `;
    });

    messagesContainer.innerHTML = html;
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  function openChat(chatId) {
    activeChatId = chatId;
    renderChatList(searchInput.value);
    renderMessages(chatId);
    
    // Mobile: show chat view
    if (window.innerWidth <= 720) {
      chatListPanel.classList.add('hidden');
      chatView.classList.add('visible');
      currentView = 'chat';
    }
  }

  function goBack() {
    if (window.innerWidth <= 720) {
      chatListPanel.classList.remove('hidden');
      chatView.classList.remove('visible');
      currentView = 'list';
    }
  }

  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    const chat = chatData.find(c => c.id === activeChatId);
    if (!chat) return;

    chat.messages.push({
      id: Date.now(),
      sender: 'Me',
      text: text,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      sent: true
    });

    // Update preview
    chat.preview = text;
    chat.time = 'Just now';

    messageInput.value = '';
    renderMessages(activeChatId);
    renderChatList(searchInput.value);
  }

  function toggleChatList() {
    if (window.innerWidth <= 720) {
      if (currentView === 'chat') {
        goBack();
      } else {
        chatListPanel.classList.toggle('hidden');
      }
    }
  }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  searchInput.addEventListener('input', (e) => {
    renderChatList(e.target.value);
  });

  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendMessage();
    }
  });

  // Handle resize
  window.addEventListener('resize', () => {
    if (window.innerWidth > 720) {
      chatListPanel.classList.remove('hidden');
      chatView.classList.remove('visible');
      currentView = 'list';
    }
  });

  // ============================================================
  // INIT
  // ============================================================
  renderChatList();
  renderMessages(activeChatId);

  console.log('📱 Ping — Messaging App');
  console.log(`📊 ${chatData.length} conversations loaded`);
</script>

</body>
</html>
