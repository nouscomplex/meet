<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>School Hub</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- CONFIGURATION -->
  <script src="config.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="nouscomplex.png">
  <link rel="apple-touch-icon" href="nouscomplex.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href='data:application/json;base64,ewogICJuYW1lIjogIlNjaG9vbCBIdWIiLAogICJzaG9ydF9uYW1lIjogIkh1YiIsCiAgImRlc2NyaXB0aW9uIjogIlVuaWZpZWQgY29tbXVuaWNhdGlvbiBwbGF0Zm9ybSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjRjRGNkY4IiwKICAidGhlbWVfY29sb3IiOiAiIzFGNkY3OCIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogIm5vdXNjb21wbGV4LnBuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIgogICAgfQogIF0KfQ==' />
</head>
<body>

<div id="app" class="app-shell">
  <div style="max-width: 1180px; margin: 0 auto; padding: 0 14px;">

    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <span class="brand-name">School Hub</span>
    </header>

    <!-- ===== AUTH CARD ===== -->
    <div id="authCard" class="auth-wrap">
      <div class="auth-card">
        <img src="nouscomplex.png" alt="School Hub" class="auth-emblem" id="authLogo">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in with your School ID to continue</p>

        <input id="usernameInput" type="text" placeholder="e.g. student042 or teacher005" class="field" autocomplete="off">
        <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top: 12px;">
          <i class="fas fa-arrow-right-to-bracket"></i> Enter Hub
        </button>
        <p id="authError" class="error-text hidden">
          <i class="fas fa-circle-exclamation"></i> <span id="authErrorText"></span>
        </p>

        <p class="auth-note">Simulated login · email confirmation off</p>
      </div>
    </div>

    <!-- ===== MAIN DASHBOARD ===== -->
    <div id="dashboard" class="hidden layout" style="padding-bottom: 24px;">

      <!-- SIDEBAR -->
      <aside class="sidebar panel">
        <div class="sidebar-head">
          <img src="nouscomplex.png" alt="School Hub" class="avatar sm" id="sidebarLogo" style="border-radius:9px;">
          <span class="label">Channels</span>
          <span id="userBadge" class="role-chip role-student-chip" style="margin-left:auto;"></span>
        </div>

        <div id="channelList" class="channel-list">
          <!-- dynamic channels -->
        </div>

        <!-- Admin panel -->
        <div id="adminPanel" class="hidden admin-card">
          <div class="section-label"><i class="fas fa-user-shield"></i> Admin console</div>
          <div class="admin-actions">
            <button id="createChannelBtn" class="btn-admin-sm">
              <i class="fas fa-plus"></i> New channel
            </button>
            <button id="rosterGenBtn" class="btn-admin-sm">
              <i class="fas fa-users"></i> Generate roster
            </button>
            <button id="exportAttendanceBtn" class="btn-admin-sm">
              <i class="fas fa-file-export"></i> Export attendance
            </button>
            <div class="admin-row">
              <input id="assignStudentInput" placeholder="Student ID" class="field-sm">
              <button id="assignStudentBtn" class="btn-admin-sm" style="flex-shrink:0;">Assign</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-col">

        <!-- Status tray -->
        <div class="panel status-strip">
          <div class="status-row scrollbar-hide" id="statusTray">
            <div id="statusPlaceholder" class="empty-note">No updates yet</div>
          </div>
          <div id="statusAddBtn" class="hidden status-add-wrap">
            <button id="postStatusBtn" class="btn btn-ghost" style="font-size:13px; padding:7px 14px;">
              <i class="fas fa-plus"></i> Post an update
            </button>
          </div>
        </div>

        <!-- Chat -->
        <div class="panel chat-panel">
          <div class="chat-scroll" id="chatContainer">
            <div id="chatMessages" style="display:flex; flex-direction:column; gap:14px;">
              <div class="empty-note center-text" style="width:100%;">Select a channel to start</div>
            </div>
          </div>
          <div id="fileUploadStatus" class="hidden"></div>

          <!-- Composer -->
          <div class="composer" style="border-top: 1px solid var(--border);">
            <input id="messageInput" type="text" placeholder="Type a message…" class="field" autocomplete="off">
            <label for="fileInput" class="icon-btn" title="Attach a file">
              <i class="fas fa-paperclip"></i>
            </label>
            <input id="fileInput" type="file" class="hidden" accept="image/*,.pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
            <button id="sendMsgBtn" class="btn-send" title="Send">
              <i class="fas fa-paper-plane"></i>
            </button>
            <button id="joinLiveBtn" class="btn-live">
              <i class="fas fa-video"></i> <span id="liveBtnText">Join live class</span>
            </button>
          </div>
        </div>

        <!-- Video -->
        <div id="videoContainer" class="hidden video-panel">
          <iframe id="videoIframe" src="" allow="camera; microphone; display-capture; autoplay; encrypted-media" allowfullscreen></iframe>
          <button id="closeVideoBtn" class="video-close"><i class="fas fa-xmark"></i></button>
        </div>

      </main>
    </div>

  </div>

  <!-- ===== STATUS MODAL ===== -->
  <div id="statusModal" class="hidden modal-overlay" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;">
    <div class="modal-card">
      <h3 id="statusModalTitle" class="modal-title"><i class="fas fa-bullhorn" style="color:var(--accent); font-size:14px;"></i> Update</h3>
      <p id="statusModalContent" class="modal-body"></p>
      <div class="progress-track">
        <div id="statusProgress" class="progress-bar"></div>
      </div>
      <button id="closeStatusModal" class="btn btn-ghost btn-block">Close</button>
    </div>
  </div>
</div>

<!-- JavaScript -->
<script src="app.js"></script>

</body>
</html>
